# Tinyauth forward-auth for a protected server block.
# Usage, inside the server block:
#     include /etc/nginx/snippets/tinyauth-auth.conf;
# and in each protected location:
#     auth_request /__tinyauth;
#     error_page 401 = @tinyauth_login;

# Session check: tinyauth answers 200 (valid session) or 401.
location = /__tinyauth {
    internal;
    proxy_pass http://tinyauth:3000/api/auth/nginx;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# No session: send the browser to the login page, then back here.
location @tinyauth_login {
    return 302 https://tinyauth.infotechno.eu/login?redirect_uri=$scheme://$http_host$request_uri;
}
